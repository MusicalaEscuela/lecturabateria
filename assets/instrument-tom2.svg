<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
    <defs>
      <linearGradient id="drumShellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#220A63"/>
        <stop offset="50%" stop-color="#5729FF"/>
        <stop offset="100%" stop-color="#CE0071"/>
      </linearGradient>
      <linearGradient id="cymbalGold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDE68A"/>
        <stop offset="35%" stop-color="#F59E0B"/>
        <stop offset="70%" stop-color="#D97706"/>
        <stop offset="100%" stop-color="#92400E"/>
      </linearGradient>
      <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#9CA3AF"/>
        <stop offset="30%" stop-color="#F3F4F6"/>
        <stop offset="60%" stop-color="#E5E7EB"/>
        <stop offset="100%" stop-color="#6B7280"/>
      </linearGradient>
      <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="70%" stop-color="#F8FAFC"/>
        <stop offset="100%" stop-color="#E2E8F0"/>
      </linearGradient>
      <radialGradient id="kickHeadGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1E1B4B"/>
        <stop offset="70%" stop-color="#0F0C29"/>
        <stop offset="100%" stop-color="#020014"/>
      </radialGradient>
      <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#220A63" flood-opacity="0.2"/>
      </filter>
    </defs>

  <rect width="240" height="240" rx="32" fill="#FBF9FE"/>
  <!-- Mount Bracket -->
  <path d="M180 120 L205 150" stroke="url(#chromeGrad)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="180" cy="120" r="6" fill="#374151"/>
  <!-- Drum Shell (slightly deeper than Tom 1) -->
  <path d="M50 80 L50 155 Q120 192 190 155 L190 80 Z" fill="url(#drumShellGrad)" filter="url(#softShadow)"/>
  <!-- Chrome Lugs -->
  <rect x="70" y="92" width="6" height="42" fill="url(#chromeGrad)" rx="2"/>
  <rect x="117" y="104" width="6" height="46" fill="url(#chromeGrad)" rx="2"/>
  <rect x="164" y="92" width="6" height="42" fill="url(#chromeGrad)" rx="2"/>
  <!-- Bottom Rim -->
  <path d="M50 155 Q120 192 190 155" stroke="url(#chromeGrad)" stroke-width="6" fill="none"/>
  <!-- Top Hoop & Batter Head -->
  <ellipse cx="120" cy="80" rx="72" ry="27" fill="url(#chromeGrad)"/>
  <ellipse cx="120" cy="80" rx="66" ry="23" fill="url(#headGrad)"/>
  <ellipse cx="120" cy="80" rx="50" ry="17" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="120" y="83" fill="#64748B" font-family="'Roboto', sans-serif" font-weight="700" font-size="10" text-anchor="middle" opacity="0.6">12"</text>
</svg>