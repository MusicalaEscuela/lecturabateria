<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Brand & Metallic Gradients -->
    <linearGradient id="drumShellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#220A63"/>
      <stop offset="50%" stop-color="#5729FF"/>
      <stop offset="100%" stop-color="#CE0071"/>
    </linearGradient>
    <linearGradient id="drumShellDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A1C71"/>
      <stop offset="100%" stop-color="#0C0A1E"/>
    </linearGradient>
    <linearGradient id="cymbalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="cymbalHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="30%" stop-color="#F3F4F6"/>
      <stop offset="60%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="kickFrontHead" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="65%" stop-color="#0F0C29"/>
      <stop offset="100%" stop-color="#020014"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0C0A1E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Floor Shadow -->
  <ellipse cx="400" cy="530" rx="340" ry="45" fill="#0C0A1E" opacity="0.12"/>
  <ellipse cx="400" cy="515" rx="260" ry="30" fill="#220A63" opacity="0.18"/>

  <!-- BACK LAYER: Stands & Cymbals -->
  <!-- Ride Cymbal Stand & Cymbal (Right Back) -->
  <g id="kit-ride" class="drum-part-hover" style="cursor:pointer;" data-instrument="Ride">
    <!-- Stand -->
    <path d="M570 320 L570 510 M570 480 L520 535 M570 480 L620 535" stroke="url(#chromeGrad)" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="570" cy="510" rx="6" ry="3" fill="#6B7280"/>
    <!-- Tilter arm -->
    <line x1="570" y1="320" x2="590" y2="250" stroke="url(#chromeGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Ride Cymbal Body -->
    <ellipse cx="600" cy="240" rx="105" ry="32" fill="url(#cymbalGold)" transform="rotate(-10 600 240)" filter="url(#dropShadow)"/>
    <ellipse cx="600" cy="240" rx="90" ry="26" fill="none" stroke="#B45309" stroke-width="1.2" opacity="0.6" transform="rotate(-10 600 240)"/>
    <ellipse cx="600" cy="240" rx="65" ry="18" fill="none" stroke="#D97706" stroke-width="1" opacity="0.5" transform="rotate(-10 600 240)"/>
    <!-- Ride Bell -->
    <ellipse cx="600" cy="240" rx="22" ry="9" fill="#FDE68A" transform="rotate(-10 600 240)"/>
    <!-- Felt & Wingnut -->
    <circle cx="600" cy="240" r="4" fill="#1F2937"/>
    <path d="M595 237 Q600 232 605 237" stroke="url(#chromeGrad)" stroke-width="3" fill="none"/>
  </g>

  <!-- Crash Cymbal Stand & Cymbal (Left Back) -->
  <g id="kit-crash" class="drum-part-hover" style="cursor:pointer;" data-instrument="Crash">
    <!-- Stand -->
    <path d="M210 280 L210 490 M210 460 L160 525 M210 460 L255 525" stroke="url(#chromeGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Boom Arm -->
    <line x1="210" y1="280" x2="200" y2="180" stroke="url(#chromeGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Crash Cymbal Body -->
    <ellipse cx="195" cy="170" rx="95" ry="28" fill="url(#cymbalGold)" transform="rotate(12 195 170)" filter="url(#dropShadow)"/>
    <ellipse cx="195" cy="170" rx="80" ry="22" fill="none" stroke="#B45309" stroke-width="1.2" opacity="0.6" transform="rotate(12 195 170)"/>
    <ellipse cx="195" cy="170" rx="55" ry="15" fill="none" stroke="#D97706" stroke-width="1" opacity="0.5" transform="rotate(12 195 170)"/>
    <!-- Cymbal Bell -->
    <ellipse cx="195" cy="170" rx="18" ry="7" fill="#FDE68A" transform="rotate(12 195 170)"/>
    <!-- Wingnut -->
    <circle cx="195" cy="170" r="3.5" fill="#1F2937"/>
  </g>

  <!-- Hi-Hat Stand, Cymbals & Pedal (Far Left) -->
  <g id="kit-hihat" class="drum-part-hover" style="cursor:pointer;" data-instrument="Hi-hat">
    <!-- Center Rod & Legs -->
    <path d="M140 230 L140 520 M140 480 L95 530 M140 480 L175 530" stroke="url(#chromeGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Hi-Hat Pedal Base -->
    <g id="kit-pedal" data-instrument="Hi-hat con pedal">
      <path d="M125 525 L155 525 L150 545 L130 545 Z" fill="#4B5563"/>
      <path d="M130 525 L150 525 L145 540 L135 540 Z" fill="url(#chromeGrad)"/>
    </g>
    <!-- Hi-Hat Bottom Cymbal -->
    <ellipse cx="140" cy="275" rx="72" ry="18" fill="#B45309" transform="rotate(2 140 275)"/>
    <!-- Hi-Hat Top Cymbal -->
    <ellipse cx="140" cy="269" rx="72" ry="18" fill="url(#cymbalGold)" transform="rotate(2 140 269)" filter="url(#dropShadow)"/>
    <ellipse cx="140" cy="269" rx="55" ry="13" fill="none" stroke="#B45309" stroke-width="1" opacity="0.5" transform="rotate(2 140 269)"/>
    <!-- Clutch & Rod Top -->
    <ellipse cx="140" cy="268" rx="14" ry="5" fill="#FDE68A"/>
    <rect x="137" y="248" width="6" height="20" fill="url(#chromeGrad)" rx="2"/>
    <circle cx="140" cy="254" r="5" fill="#374151"/>
  </g>

  <!-- MID LAYER: Bass Drum (Bombo) -->
  <g id="kit-kick" class="drum-part-hover" style="cursor:pointer;" data-instrument="Bombo">
    <!-- Bass Drum Shell depth -->
    <path d="M290 380 Q400 320 510 380 L510 440 Q400 500 290 440 Z" fill="url(#drumShellDark)" opacity="0.9"/>
    <!-- Bass Drum Front Hoop (Rim) -->
    <ellipse cx="400" cy="415" rx="138" ry="118" fill="url(#chromeGrad)"/>
    <!-- Bass Drum Inlay Hoop -->
    <ellipse cx="400" cy="415" rx="134" ry="114" fill="#220A63"/>
    <!-- Bass Drum Front Head -->
    <ellipse cx="400" cy="415" rx="126" ry="106" fill="url(#kickFrontHead)"/>
    <!-- Subhead reflection ring -->
    <ellipse cx="400" cy="415" rx="112" ry="94" fill="none" stroke="#5729FF" stroke-width="2" opacity="0.35"/>
    <!-- Musicala Sound Port / Subvent or Logo Text -->
    <circle cx="460" cy="445" r="22" fill="#030014" stroke="#5729FF" stroke-width="3"/>
    <ellipse cx="460" cy="445" rx="20" ry="20" fill="#000000" opacity="0.8"/>
    <!-- Kick Logo Art -->
    <g transform="translate(370, 375)">
      <path d="M12 28 C12 18, 16 12, 22 12 C28 12, 30 18, 30 28" fill="none" stroke="#CE0071" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M22 28 C22 18, 26 12, 32 12 C38 12, 40 18, 40 28" fill="none" stroke="#5729FF" stroke-width="3.5" stroke-linecap="round"/>
      <text x="30" y="42" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-weight="800" font-size="9" text-anchor="middle" letter-spacing="2">MUSICALA</text>
    </g>
    <!-- Tension Rods / Claws -->
    <rect x="264" y="410" width="10" height="8" fill="url(#chromeGrad)" rx="2"/>
    <rect x="526" y="410" width="10" height="8" fill="url(#chromeGrad)" rx="2"/>
    <rect x="305" y="325" width="9" height="9" fill="url(#chromeGrad)" rx="2"/>
    <rect x="485" y="325" width="9" height="9" fill="url(#chromeGrad)" rx="2"/>
    <rect x="305" y="495" width="9" height="9" fill="url(#chromeGrad)" rx="2"/>
    <rect x="485" y="495" width="9" height="9" fill="url(#chromeGrad)" rx="2"/>
    <!-- Spurs (Bass Drum Legs) -->
    <path d="M280 440 L230 520" stroke="url(#chromeGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="230" cy="520" r="6" fill="#1F2937"/>
    <path d="M520 440 L570 520" stroke="url(#chromeGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="570" cy="520" r="6" fill="#1F2937"/>
    <!-- Kick Pedal Mechanism (Center Floor) -->
    <g transform="translate(385, 490)">
      <rect x="5" y="10" width="20" height="38" rx="4" fill="url(#chromeGrad)"/>
      <rect x="9" y="14" width="12" height="28" rx="2" fill="#1E1B4B"/>
      <!-- Beater Rod -->
      <line x1="15" y1="10" x2="15" y2="-20" stroke="url(#chromeGrad)" stroke-width="4"/>
      <!-- Beater Felt -->
      <rect x="11" y="-30" width="8" height="12" rx="3" fill="#F8FAFC"/>
    </g>
  </g>

  <!-- MOUNTED TOMS on Kick -->
  <!-- Mount Arms -->
  <path d="M370 330 L350 280 M430 330 L450 280" stroke="url(#chromeGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Tom 1 (Tom Agudo - Left Rack Tom) -->
  <g id="kit-tom1" class="drum-part-hover" style="cursor:pointer;" data-instrument="Tom agudo">
    <!-- Shell -->
    <path d="M305 240 L305 285 Q350 305 395 285 L395 240 Z" fill="url(#drumShellGrad)"/>
    <!-- Chrome Lugs -->
    <rect x="315" y="248" width="5" height="22" fill="url(#chromeGrad)" rx="1.5"/>
    <rect x="348" y="254" width="5" height="24" fill="url(#chromeGrad)" rx="1.5"/>
    <rect x="382" y="248" width="5" height="22" fill="url(#chromeGrad)" rx="1.5"/>
    <!-- Bottom Rim -->
    <path d="M305 285 Q350 305 395 285" stroke="url(#chromeGrad)" stroke-width="5" fill="none"/>
    <!-- Top Batter Rim & Head -->
    <ellipse cx="350" cy="240" rx="46" ry="18" fill="url(#chromeGrad)"/>
    <ellipse cx="350" cy="240" rx="42" ry="15" fill="url(#headGrad)"/>
    <ellipse cx="350" cy="240" rx="34" ry="11" fill="none" stroke="#CBD5E1" stroke-width="1"/>
  </g>

  <!-- Tom 2 (Tom Medio - Right Rack Tom) -->
  <g id="kit-tom2" class="drum-part-hover" style="cursor:pointer;" data-instrument="Tom medio">
    <!-- Shell -->
    <path d="M410 245 L410 295 Q455 315 500 295 L500 245 Z" fill="url(#drumShellGrad)"/>
    <!-- Chrome Lugs -->
    <rect x="420" y="255" width="5" height="24" fill="url(#chromeGrad)" rx="1.5"/>
    <rect x="453" y="260" width="5" height="26" fill="url(#chromeGrad)" rx="1.5"/>
    <rect x="487" y="255" width="5" height="24" fill="url(#chromeGrad)" rx="1.5"/>
    <!-- Bottom Rim -->
    <path d="M410 295 Q455 315 500 295" stroke="url(#chromeGrad)" stroke-width="5" fill="none"/>
    <!-- Top Batter Rim & Head -->
    <ellipse cx="455" cy="245" rx="48" ry="19" fill="url(#chromeGrad)"/>
    <ellipse cx="455" cy="245" rx="44" ry="16" fill="url(#headGrad)"/>
    <ellipse cx="455" cy="245" rx="35" ry="12" fill="none" stroke="#CBD5E1" stroke-width="1"/>
  </g>

  <!-- FOREGROUND LAYER: Snare & Floor Tom -->
  <!-- Floor Tom (Tom de Piso - Right Foreground) -->
  <g id="kit-floor" class="drum-part-hover" style="cursor:pointer;" data-instrument="Tom de piso">
    <!-- 3 Chrome Legs -->
    <path d="M525 430 L515 540 M600 440 L605 545 M635 430 L650 535" stroke="url(#chromeGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Shell -->
    <path d="M525 365 L525 460 Q580 488 635 460 L635 365 Z" fill="url(#drumShellGrad)"/>
    <!-- Lugs & Leg brackets -->
    <rect x="536" y="380" width="6" height="35" fill="url(#chromeGrad)" rx="2"/>
    <rect x="577" y="390" width="6" height="38" fill="url(#chromeGrad)" rx="2"/>
    <rect x="618" y="380" width="6" height="35" fill="url(#chromeGrad)" rx="2"/>
    <circle cx="539" cy="425" r="4" fill="#374151"/>
    <circle cx="621" cy="425" r="4" fill="#374151"/>
    <!-- Bottom Rim -->
    <path d="M525 460 Q580 488 635 460" stroke="url(#chromeGrad)" stroke-width="6" fill="none"/>
    <!-- Top Batter Rim & Head -->
    <ellipse cx="580" cy="365" rx="58" ry="22" fill="url(#chromeGrad)" filter="url(#dropShadow)"/>
    <ellipse cx="580" cy="365" rx="53" ry="19" fill="url(#headGrad)"/>
    <ellipse cx="580" cy="365" rx="42" ry="14" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
  </g>

  <!-- Snare Drum (Redoblante / Caja - Left Foreground) -->
  <g id="kit-snare" class="drum-part-hover" style="cursor:pointer;" data-instrument="Redoblante">
    <!-- Stand Basket & Legs -->
    <path d="M245 425 L245 520 M245 490 L205 535 M245 490 L285 535" stroke="url(#chromeGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M210 380 L235 415 M280 380 L255 415" stroke="url(#chromeGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Snare Shell (Metallic Chrome / Deep Purple Sheen) -->
    <path d="M195 345 L195 390 Q245 412 295 390 L295 345 Z" fill="url(#chromeGrad)"/>
    <path d="M195 352 L195 383 Q245 405 295 383 L295 352 Z" fill="#220A63" opacity="0.85"/>
    <!-- Snare Strainer & Lugs -->
    <rect x="203" y="355" width="5" height="24" fill="url(#chromeGrad)" rx="1.5"/>
    <rect x="242" y="360" width="5" height="26" fill="url(#chromeGrad)" rx="1.5"/>
    <rect x="281" y="355" width="5" height="24" fill="url(#chromeGrad)" rx="1.5"/>
    <!-- Strainer throw-off switch -->
    <rect x="190" y="362" width="6" height="12" fill="#CE0071" rx="2"/>
    <!-- Bottom Rim -->
    <path d="M195 390 Q245 412 295 390" stroke="url(#chromeGrad)" stroke-width="5" fill="none"/>
    <!-- Top Batter Rim & Coated Head -->
    <ellipse cx="245" cy="345" rx="54" ry="20" fill="url(#chromeGrad)" filter="url(#dropShadow)"/>
    <ellipse cx="245" cy="345" rx="49" ry="17" fill="url(#headGrad)"/>
    <ellipse cx="245" cy="345" rx="38" ry="12" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
    <circle cx="245" cy="345" r="14" fill="#FFFFFF" opacity="0.7"/>

    <!-- Pair of Drumsticks crossed across snare -->
    <g transform="rotate(15 245 345)">
      <!-- Stick 1 -->
      <path d="M185 340 L305 346" stroke="#D1A36B" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="305" cy="346" rx="3.5" ry="2" fill="#E2B77D"/>
      <!-- Stick 2 -->
      <path d="M190 354 L300 334" stroke="#E2B77D" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="300" cy="334" rx="3.5" ry="2" fill="#D1A36B"/>
    </g>
  </g>

  <!-- Interactive Highlight Overlay Tags / Badges -->
  <g id="kit-labels" opacity="0.95" style="pointer-events:none;">
    <g id="tag-crash" transform="translate(195, 125)">
      <rect x="-35" y="-12" width="70" height="24" rx="12" fill="#220A63" stroke="#5729FF" stroke-width="1.5"/>
      <text x="0" y="4" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-weight="700" font-size="11" text-anchor="middle">Crash</text>
    </g>
    <g id="tag-ride" transform="translate(605, 195)">
      <rect x="-30" y="-12" width="60" height="24" rx="12" fill="#220A63" stroke="#5729FF" stroke-width="1.5"/>
      <text x="0" y="4" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-weight="700" font-size="11" text-anchor="middle">Ride</text>
    </g>
    <g id="tag-hihat" transform="translate(90, 265)">
      <rect x="-32" y="-12" width="64" height="24" rx="12" fill="#220A63" stroke="#CE0071" stroke-width="1.5"/>
      <text x="0" y="4" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-weight="700" font-size="11" text-anchor="middle">Hi-hat</text>
    </g>
    <g id="tag-snare" transform="translate(180, 420)">
      <rect x="-42" y="-12" width="84" height="24" rx="12" fill="#220A63" stroke="#5729FF" stroke-width="1.5"/>
      <text x="0" y="4" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-weight="700" font-size="11" text-anchor="middle">Redoblante</text>
    </g>
    <g id="tag-kick" transform="translate(400, 475)">
      <rect x="-32" y="-12" width="64" height="24" rx="12" fill="#220A63" stroke="#0C41C4" stroke-width="1.5"/>
      <text x="0" y="4" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-weight="700" font-size="11" text-anchor="middle">Bombo</text>
    </g>
  </g>
</svg>