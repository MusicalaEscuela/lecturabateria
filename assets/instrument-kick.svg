<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
    <defs>
      <linearGradient id="drumShellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#220A63"/>
        <stop offset="50%" stop-color="#5729FF"/>
        <stop offset="100%" stop-color="#CE0071"/>
      </linearGradient>
      <linearGradient id="cymbalGold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDE68A"/>
        <stop offset="35%" stop-color="#F59E0B"/>
        <stop offset="70%" stop-color="#D97706"/>
        <stop offset="100%" stop-color="#92400E"/>
      </linearGradient>
      <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#9CA3AF"/>
        <stop offset="30%" stop-color="#F3F4F6"/>
        <stop offset="60%" stop-color="#E5E7EB"/>
        <stop offset="100%" stop-color="#6B7280"/>
      </linearGradient>
      <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="70%" stop-color="#F8FAFC"/>
        <stop offset="100%" stop-color="#E2E8F0"/>
      </linearGradient>
      <radialGradient id="kickHeadGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1E1B4B"/>
        <stop offset="70%" stop-color="#0F0C29"/>
        <stop offset="100%" stop-color="#020014"/>
      </radialGradient>
      <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#220A63" flood-opacity="0.2"/>
      </filter>
    </defs>

  <rect width="240" height="240" rx="32" fill="#FBF9FE"/>
  <!-- Floor Shadow -->
  <ellipse cx="120" cy="210" rx="85" ry="14" fill="#220A63" opacity="0.15"/>
  <!-- Spurs (Patas) -->
  <path d="M45 160 L20 215" stroke="url(#chromeGrad)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="20" cy="215" r="5" fill="#1F2937"/>
  <path d="M195 160 L220 215" stroke="url(#chromeGrad)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="220" cy="215" r="5" fill="#1F2937"/>
  <!-- Wooden Drum Shell Outer Rim -->
  <circle cx="120" cy="115" r="82" fill="url(#chromeGrad)" filter="url(#softShadow)"/>
  <circle cx="120" cy="115" r="78" fill="#220A63"/>
  <!-- Front Drumhead (Negro / Deep Indigo) -->
  <circle cx="120" cy="115" r="72" fill="url(#kickHeadGrad)"/>
  <!-- Resonance Soundhole (Puerto de descompresión) -->
  <circle cx="155" cy="140" r="16" fill="#000000" stroke="#5729FF" stroke-width="2.5"/>
  <!-- Musicala Emblem -->
  <g transform="translate(100, 85)">
    <path d="M10 20 C10 12, 14 8, 20 8 C26 8, 28 12, 28 20" fill="none" stroke="#CE0071" stroke-width="3" stroke-linecap="round"/>
    <path d="M18 20 C18 12, 22 8, 28 8 C34 8, 36 12, 36 20" fill="none" stroke="#5729FF" stroke-width="3" stroke-linecap="round"/>
    <text x="20" y="32" fill="#FFFFFF" font-family="'Roboto', sans-serif" font-weight="900" font-size="8" text-anchor="middle" letter-spacing="1.5">MUSICALA</text>
  </g>
  <!-- Lugs / Claws around rim -->
  <rect x="116" y="31" width="8" height="7" fill="url(#chromeGrad)" rx="1.5"/>
  <rect x="116" y="192" width="8" height="7" fill="url(#chromeGrad)" rx="1.5"/>
  <rect x="36" y="111" width="7" height="8" fill="url(#chromeGrad)" rx="1.5"/>
  <rect x="197" y="111" width="7" height="8" fill="url(#chromeGrad)" rx="1.5"/>
  <!-- Bass Drum Pedal at base -->
  <rect x="110" y="195" width="20" height="24" fill="url(#chromeGrad)" rx="3"/>
  <line x1="120" y1="195" x2="120" y2="175" stroke="url(#chromeGrad)" stroke-width="3.5"/>
  <circle cx="120" cy="172" r="5" fill="#F8FAFC"/>
</svg>