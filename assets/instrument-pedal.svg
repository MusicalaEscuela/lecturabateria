<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
    <defs>
      <linearGradient id="drumShellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#220A63"/>
        <stop offset="50%" stop-color="#5729FF"/>
        <stop offset="100%" stop-color="#CE0071"/>
      </linearGradient>
      <linearGradient id="cymbalGold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDE68A"/>
        <stop offset="35%" stop-color="#F59E0B"/>
        <stop offset="70%" stop-color="#D97706"/>
        <stop offset="100%" stop-color="#92400E"/>
      </linearGradient>
      <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#9CA3AF"/>
        <stop offset="30%" stop-color="#F3F4F6"/>
        <stop offset="60%" stop-color="#E5E7EB"/>
        <stop offset="100%" stop-color="#6B7280"/>
      </linearGradient>
      <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="70%" stop-color="#F8FAFC"/>
        <stop offset="100%" stop-color="#E2E8F0"/>
      </linearGradient>
      <radialGradient id="kickHeadGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1E1B4B"/>
        <stop offset="70%" stop-color="#0F0C29"/>
        <stop offset="100%" stop-color="#020014"/>
      </radialGradient>
      <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#220A63" flood-opacity="0.2"/>
      </filter>
    </defs>

  <rect width="240" height="240" rx="32" fill="#FBF9FE"/>
  <!-- Shadow -->
  <ellipse cx="120" cy="195" rx="65" ry="12" fill="#220A63" opacity="0.16"/>
  <!-- Base Plate Frame -->
  <path d="M90 60 L150 60 L160 185 L80 185 Z" fill="#374151" rx="4"/>
  <!-- Inner Footboard (Plate) -->
  <path d="M96 68 L144 68 L152 178 L88 178 Z" fill="url(#chromeGrad)"/>
  <!-- Traction Grips on Footboard -->
  <line x1="102" y1="95" x2="138" y2="95" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="115" x2="140" y2="115" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round"/>
  <line x1="98" y1="135" x2="142" y2="135" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round"/>
  <line x1="96" y1="155" x2="144" y2="155" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round"/>
  <!-- Heel Plate & Hinge -->
  <rect x="86" y="178" width="68" height="22" fill="#1F2937" rx="4"/>
  <rect x="94" y="182" width="52" height="14" fill="url(#chromeGrad)" rx="2"/>
  <!-- Chain Drive at Top -->
  <rect x="114" y="35" width="12" height="32" fill="#4B5563" rx="2"/>
  <circle cx="120" cy="40" r="3" fill="#D1D5DB"/>
  <circle cx="120" cy="48" r="3" fill="#D1D5DB"/>
  <circle cx="120" cy="56" r="3" fill="#D1D5DB"/>
  <!-- Foot Icon Indicator -->
  <g transform="translate(108, 100)" opacity="0.4">
    <ellipse cx="12" cy="18" rx="8" ry="12" fill="#5729FF"/>
    <circle cx="12" cy="4" r="3.5" fill="#5729FF"/>
  </g>
</svg>