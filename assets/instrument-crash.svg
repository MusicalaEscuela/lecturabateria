<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
    <defs>
      <linearGradient id="drumShellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#220A63"/>
        <stop offset="50%" stop-color="#5729FF"/>
        <stop offset="100%" stop-color="#CE0071"/>
      </linearGradient>
      <linearGradient id="cymbalGold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDE68A"/>
        <stop offset="35%" stop-color="#F59E0B"/>
        <stop offset="70%" stop-color="#D97706"/>
        <stop offset="100%" stop-color="#92400E"/>
      </linearGradient>
      <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#9CA3AF"/>
        <stop offset="30%" stop-color="#F3F4F6"/>
        <stop offset="60%" stop-color="#E5E7EB"/>
        <stop offset="100%" stop-color="#6B7280"/>
      </linearGradient>
      <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="70%" stop-color="#F8FAFC"/>
        <stop offset="100%" stop-color="#E2E8F0"/>
      </linearGradient>
      <radialGradient id="kickHeadGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1E1B4B"/>
        <stop offset="70%" stop-color="#0F0C29"/>
        <stop offset="100%" stop-color="#020014"/>
      </radialGradient>
      <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#220A63" flood-opacity="0.2"/>
      </filter>
    </defs>

  <rect width="240" height="240" rx="32" fill="#FBF9FE"/>
  <!-- Boom Stand -->
  <path d="M120 160 L120 225 M120 205 L80 232 M120 205 L160 232" stroke="url(#chromeGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="120" y1="160" x2="120" y2="110" stroke="url(#chromeGrad)" stroke-width="4.5"/>
  <!-- Energy Splash Accents -->
  <path d="M45 70 Q30 55 40 40 M195 70 Q210 55 200 40" stroke="#CE0071" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <circle cx="35" cy="55" r="2.5" fill="#CE0071" opacity="0.7"/>
  <circle cx="205" cy="55" r="2.5" fill="#CE0071" opacity="0.7"/>
  <!-- Cymbal Disk -->
  <ellipse cx="120" cy="100" rx="88" ry="28" fill="url(#cymbalGold)" transform="rotate(-6 120 100)" filter="url(#softShadow)"/>
  <ellipse cx="120" cy="100" rx="72" ry="22" fill="none" stroke="#B45309" stroke-width="1.2" opacity="0.6" transform="rotate(-6 120 100)"/>
  <ellipse cx="120" cy="100" rx="48" ry="14" fill="none" stroke="#D97706" stroke-width="1.2" opacity="0.5" transform="rotate(-6 120 100)"/>
  <!-- Bell -->
  <ellipse cx="120" cy="100" rx="20" ry="8" fill="#FDE68A" transform="rotate(-6 120 100)"/>
  <!-- Felt & Wingnut -->
  <rect x="117" y="88" width="6" height="10" fill="#1F2937" rx="1.5"/>
  <path d="M112 88 Q120 82 128 88" stroke="url(#chromeGrad)" stroke-width="3" fill="none"/>
</svg>