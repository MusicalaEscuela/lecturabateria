<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
    <defs>
      <linearGradient id="drumShellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#220A63"/>
        <stop offset="50%" stop-color="#5729FF"/>
        <stop offset="100%" stop-color="#CE0071"/>
      </linearGradient>
      <linearGradient id="cymbalGold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDE68A"/>
        <stop offset="35%" stop-color="#F59E0B"/>
        <stop offset="70%" stop-color="#D97706"/>
        <stop offset="100%" stop-color="#92400E"/>
      </linearGradient>
      <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#9CA3AF"/>
        <stop offset="30%" stop-color="#F3F4F6"/>
        <stop offset="60%" stop-color="#E5E7EB"/>
        <stop offset="100%" stop-color="#6B7280"/>
      </linearGradient>
      <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="70%" stop-color="#F8FAFC"/>
        <stop offset="100%" stop-color="#E2E8F0"/>
      </linearGradient>
      <radialGradient id="kickHeadGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1E1B4B"/>
        <stop offset="70%" stop-color="#0F0C29"/>
        <stop offset="100%" stop-color="#020014"/>
      </radialGradient>
      <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#220A63" flood-opacity="0.2"/>
      </filter>
    </defs>

  <rect width="240" height="240" rx="32" fill="#FBF9FE"/>
  <!-- Stand -->
  <path d="M120 155 L120 225 M120 205 L80 232 M120 205 L160 232" stroke="url(#chromeGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="120" y1="155" x2="120" y2="105" stroke="url(#chromeGrad)" stroke-width="4.5"/>
  <!-- Steady Pulse Rhythm Rings -->
  <circle cx="120" cy="98" r="94" fill="none" stroke="#5729FF" stroke-width="1" stroke-dasharray="4 4" opacity="0.25"/>
  <!-- Heavy Bronze Ride Disk -->
  <ellipse cx="120" cy="98" rx="92" ry="30" fill="url(#cymbalGold)" transform="rotate(4 120 98)" filter="url(#softShadow)"/>
  <ellipse cx="120" cy="98" rx="78" ry="24" fill="none" stroke="#92400E" stroke-width="1.2" opacity="0.65" transform="rotate(4 120 98)"/>
  <ellipse cx="120" cy="98" rx="55" ry="16" fill="none" stroke="#B45309" stroke-width="1.2" opacity="0.55" transform="rotate(4 120 98)"/>
  <!-- Pronounced Bell (Campana del Ride) -->
  <ellipse cx="120" cy="98" rx="24" ry="10" fill="#FDE68A" transform="rotate(4 120 98)"/>
  <ellipse cx="120" cy="96" rx="14" ry="6" fill="#FFFBEB" transform="rotate(4 120 98)"/>
  <!-- Top Felt & Chrome Nut -->
  <circle cx="120" cy="98" r="4.5" fill="#1F2937"/>
  <rect x="117" y="86" width="6" height="8" fill="url(#chromeGrad)" rx="1"/>
</svg>